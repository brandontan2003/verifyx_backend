services:
  verifyx-backend-service:
    init: true
    build:
      dockerfile: ./Dockerfile
    image: verifyx-backend-image:latest
    container_name: verifyx_backend_service
    env_file:
      - .env.dev
    ports:
      - '8000:8000'
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      verifyx-flyway:
        condition: service_completed_successfully

  verifyx-flyway:
    init: true
    image: flyway/flyway:12.7.0
    container_name: verifyx-flyway
    env_file:
      - .env.dev
    volumes:
      - ./db-migration:/flyway/sql
    entrypoint: ["flyway", "migrate"]
    depends_on:
      - verifyx-postgres
    restart: on-failure

  verifyx-postgres:
    image: postgres:17
    container_name: verifyx-postgres
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    restart: on-failure
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:

networks:
  default:
    name: verifyx-network